<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloudflare JS混淆工具</title>
    <!-- 多重容灾加载混淆器核心库 -->
    <script src="/index.browser.js" onerror="loadFallbackCDN(this)"></script>
    <script>
        function loadFallbackCDN(el) {
            console.warn("Local worker /index.browser.js failed, trying jsDelivr...");
            const s1 = document.createElement("script");
            s1.src = "https://cdn.jsdelivr.net/npm/javascript-obfuscator@4.1.1/dist/index.browser.js";
            s1.onerror = function() {
                console.warn("jsDelivr failed, trying unpkg...");
                const s2 = document.createElement("script");
                s2.src = "https://unpkg.com/javascript-obfuscator@4.1.1/dist/index.browser.js";
                document.head.appendChild(s2);
            };
            document.head.appendChild(s1);
        }
    </script>
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --card-bg: #252525;
            --text-primary: #e0e0e0;
            --text-secondary: #9e9e9e;
            --border-color: #333333;
            --primary-blue: #2196f3;
            --hover-blue: #1976d2;
            --success-color: #4caf50;
            --danger-color: #f44336;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            min-height: 100vh;
            padding: 25px 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .main-container {
            width: 100%;
            max-width: 1080px;
            background-color: var(--container-bg);
            padding: 26px 28px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .header h2 {
            font-size: 1.55rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 13.5px;
        }

        /* 顶部紧凑拖拽上传栏 */
        .upload-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.02);
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .upload-bar:hover, .upload-bar.dragover {
            border-color: var(--primary-blue);
            background: rgba(33, 150, 243, 0.05);
        }

        .upload-left {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13.5px;
            color: var(--text-secondary);
        }

        .upload-left .icon { font-size: 20px; }
        .upload-right button {
            background: #2b313a;
            border: 1px solid #3d4450;
            color: #d1d5db;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 12.5px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .upload-right button:hover {
            background: #374151;
            color: #ffffff;
        }

        /* 双栏编辑器布局 */
        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 18px;
        }

        @media (max-width: 820px) {
            .editor-grid { grid-template-columns: 1fr; gap: 16px; }
        }

        .editor-card {
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.2);
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 600;
            color: #d0d7de;
        }

        .editor-header .badge {
            font-size: 11px;
            background: rgba(33, 150, 243, 0.15);
            color: var(--primary-blue);
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: normal;
        }

        textarea.code-area {
            width: 100%;
            height: 360px;
            background: #181818;
            color: #f0f0f0;
            border: none;
            outline: none;
            padding: 14px;
            font-family: "Cascadia Code", "Fira Code", Consolas, Monaco, "Courier New", monospace;
            font-size: 13px;
            line-height: 1.6;
            resize: vertical;
            white-space: pre;
            tab-size: 2;
        }

        textarea.code-area::placeholder {
            color: #555555;
            font-family: inherit;
        }

        /* 统计栏 */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.35);
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
            font-family: "Cascadia Code", Consolas, monospace;
        }

        .stats-bar .stat-num {
            color: #58a6ff;
            font-weight: 600;
        }

        /* 按钮与操作区域 */
        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }

        .btn-group-left, .btn-group-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        button.btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 11px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary-blue);
            color: #ffffff;
        }
        .btn-primary:hover:not(:disabled) { background-color: var(--hover-blue); }
        .btn-primary:disabled { background-color: #333333; color: #666666; cursor: not-allowed; }

        .btn-secondary {
            background: #2d333b;
            color: #e0e0e0;
            border: 1px solid #444c56 !important;
        }
        .btn-secondary:hover:not(:disabled) { background: #373e47; color: #ffffff; }
        .btn-secondary:disabled { background: #22272e; color: #555555; cursor: not-allowed; border-color: #333 !important; }

        .btn-danger {
            background: transparent;
            color: #8b949e;
            border: 1px solid transparent !important;
        }
        .btn-danger:hover { color: var(--danger-color); }

        .status-tip {
            font-size: 12.5px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <h2>Cloudflare JS 混淆工具</h2>
            <p>支持粘贴代码与文件上传 · 支持二次叠加混淆 · 100% 适配 Cloudflare Workers</p>
        </div>

        <!-- 顶部拖拽上传与文件选择 -->
        <div id="upload-bar" class="upload-bar" title="点击或拖拽 .js 文件载入编辑器">
            <div class="upload-left">
                <span class="icon">📄</span>
                <span id="upload-hint">拖入 .js 源码文件 或 点击此处选择文件</span>
            </div>
            <div class="upload-right">
                <button type="button" onclick="event.stopPropagation(); fileInput.click();">浏览本地文件</button>
            </div>
        </div>
        <input type="file" id="file-input" accept=".js,.txt" style="display: none;">

        <!-- 左右/上下代码编辑器 -->
        <div class="editor-grid">
            <!-- 输入端 -->
            <div class="editor-card">
                <div class="editor-header">
                    <span>源代码 (输入)</span>
                    <span class="badge">JavaScript</span>
                </div>
                <textarea id="input-code" class="code-area" placeholder="// 在此处直接粘贴明文或待二次混淆的 JavaScript 源码...&#10;// 也可直接拖拽 .js 文件到上方区域自动填入"></textarea>
                <div class="stats-bar">
                    <div>
                        字符数: <span id="input-chars" class="stat-num">0</span> | 行数: <span id="input-lines" class="stat-num">0</span>
                    </div>
                    <div>
                        大小: <span id="input-bytes" class="stat-num">0 B</span>
                    </div>
                </div>
            </div>

            <!-- 输出端 -->
            <div class="editor-card">
                <div class="editor-header">
                    <span>混淆后代码 (输出)</span>
                    <span id="output-badge" class="badge" style="background: rgba(76, 175, 80, 0.15); color: #4caf50;">待混淆</span>
                </div>
                <textarea id="output-code" class="code-area" readonly placeholder="// 点击【开始混淆】后，混淆结果将在此处呈现并支持一键复制..."></textarea>
                <div class="stats-bar">
                    <div>
                        字符数: <span id="output-chars" class="stat-num">0</span> | 行数: <span id="output-lines" class="stat-num">0</span>
                    </div>
                    <div>
                        大小: <span id="output-bytes" class="stat-num">0 B</span> | 变化: <span id="ratio-text" class="stat-num">0%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部控制按钮与统计 -->
        <div class="controls-bar">
            <div class="btn-group-left">
                <button id="process-btn" class="btn btn-primary" disabled>
                    <span>⚡ 开始混淆</span>
                </button>
                <button id="copy-btn" class="btn btn-secondary" disabled>
                    <span>📋 一键复制结果</span>
                </button>
                <button id="download-btn" class="btn btn-secondary" disabled>
                    <span>💾 下载 _worker.js</span>
                </button>
                <button id="clear-btn" class="btn btn-danger" type="button">
                    <span>清空</span>
                </button>
            </div>
            <div class="btn-group-right">
                <span id="status-tip" class="status-tip">等待输入代码</span>
            </div>
        </div>
    </div>

    <script>
        const inputCode = document.getElementById("input-code");
        const outputCode = document.getElementById("output-code");
        const uploadBar = document.getElementById("upload-bar");
        const uploadHint = document.getElementById("upload-hint");
        const fileInput = document.getElementById("file-input");

        const processBtn = document.getElementById("process-btn");
        const copyBtn = document.getElementById("copy-btn");
        const downloadBtn = document.getElementById("download-btn");
        const clearBtn = document.getElementById("clear-btn");
        const statusTip = document.getElementById("status-tip");
        const outputBadge = document.getElementById("output-badge");

        const inputChars = document.getElementById("input-chars");
        const inputLines = document.getElementById("input-lines");
        const inputBytes = document.getElementById("input-bytes");

        const outputChars = document.getElementById("output-chars");
        const outputLines = document.getElementById("output-lines");
        const outputBytes = document.getElementById("output-bytes");
        const ratioText = document.getElementById("ratio-text");

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return "0 B";
            const k = 1024;
            const sizes = ["B", "KB", "MB"];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
        }

        function updateInputStats() {
            const text = inputCode.value;
            const chars = text.length;
            const lines = chars > 0 ? text.split("\n").length : 0;
            const byteSize = new Blob([text]).size;

            inputChars.innerText = chars.toLocaleString();
            inputLines.innerText = lines.toLocaleString();
            inputBytes.innerText = formatBytes(byteSize);

            processBtn.disabled = chars === 0;
            if (chars > 0) {
                statusTip.innerText = "代码已就绪，点击【开始混淆】";
                statusTip.style.color = "#9e9e9e";
            } else {
                statusTip.innerText = "等待输入代码";
                statusTip.style.color = "#9e9e9e";
            }
        }

        function updateOutputStats(obfuscatedText) {
            const inBytes = new Blob([inputCode.value]).size;
            const chars = obfuscatedText.length;
            const lines = chars > 0 ? obfuscatedText.split("\n").length : 0;
            const outBytes = new Blob([obfuscatedText]).size;

            outputChars.innerText = chars.toLocaleString();
            outputLines.innerText = lines.toLocaleString();
            outputBytes.innerText = formatBytes(outBytes);

            if (inBytes > 0) {
                const diff = ((outBytes - inBytes) / inBytes * 100).toFixed(1);
                ratioText.innerText = (diff >= 0 ? "+" : "") + diff + "%";
                ratioText.style.color = diff >= 0 ? "#58a6ff" : "#4caf50";
            } else {
                ratioText.innerText = "0%";
            }

            copyBtn.disabled = chars === 0;
            downloadBtn.disabled = chars === 0;
        }

        inputCode.addEventListener("input", updateInputStats);

        // 拖拽文件逻辑
        ["dragenter", "dragover", "dragleave", "drop"].forEach(name => {
            uploadBar.addEventListener(name, e => { e.preventDefault(); e.stopPropagation(); });
        });
        uploadBar.addEventListener("dragover", () => uploadBar.classList.add("dragover"));
        ["dragleave", "drop"].forEach(name => uploadBar.addEventListener(name, () => uploadBar.classList.remove("dragover")));
        uploadBar.addEventListener("drop", e => handleFiles(e.dataTransfer.files));
        uploadBar.addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", e => handleFiles(e.target.files));

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                uploadHint.innerText = "已加载文件: " + file.name + " (" + formatBytes(file.size) + ")";
                uploadBar.style.borderColor = "var(--primary-blue)";
                const reader = new FileReader();
                reader.onload = (e) => {
                    inputCode.value = e.target.result;
                    updateInputStats();
                };
                reader.readAsText(file);
            }
        }

        // 清空
        clearBtn.addEventListener("click", () => {
            inputCode.value = "";
            outputCode.value = "";
            uploadHint.innerText = "拖入 .js 源码文件 或 点击此处选择文件";
            uploadBar.style.borderColor = "var(--border-color)";
            fileInput.value = "";
            outputBadge.innerText = "待混淆";
            outputBadge.style.color = "#4caf50";
            updateInputStats();
            updateOutputStats("");
        });

        // 复制
        copyBtn.addEventListener("click", async () => {
            if (!outputCode.value) return;
            try {
                await navigator.clipboard.writeText(outputCode.value);
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "✅ 已复制到剪贴板";
                setTimeout(() => { copyBtn.innerText = originalText; }, 1800);
            } catch (err) {
                outputCode.select();
                document.execCommand("copy");
                alert("已复制到剪贴板");
            }
        });

        // 下载
        downloadBtn.addEventListener("click", () => {
            if (!outputCode.value) return;
            const blob = new Blob([outputCode.value], { type: "application/javascript;charset=utf-8" });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.style.display = "none";
            a.href = url;
            a.download = "_worker.js";
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);
        });

        // 核心混淆逻辑（严格保持原生配置，确保已混淆代码能顺畅二次混淆）
        processBtn.addEventListener("click", () => {
            const rawSource = inputCode.value.trim();
            if (!rawSource) return;

            processBtn.disabled = true;
            processBtn.innerText = "混淆中...";
            statusTip.innerText = "正在进行 AST 分析与混淆...";
            statusTip.style.color = "var(--primary-blue)";
            outputBadge.innerText = "混淆中";

            setTimeout(() => {
                try {
                    const config = {
                        // ==================== 基础输出配置 ====================
                        compact: true,                          // 紧凑单行输出，减少体积，提升 Worker 加载速度
                        sourceMap: false,                       // 关闭 source map，生产环境不需要
                        target: "browser",                      // 输出目标为浏览器环境，适配 Cloudflare Workers 的 V8 引擎
                        
                        // ==================== 控制流保护（完全禁用，避免 CPU 超时） ====================
                        controlFlowFlattening: false,           // 禁用控制流扁平化，避免在 Worker 中引发 CPU 超时
                        controlFlowFlatteningThreshold: 0,
                        deadCodeInjection: false,               // 禁用死代码注入，减少内存占用
                        simplify: false,                        // 【关键】设为 false，确保对已混淆代码二次混淆不破坏 AST，且不误删内容
                        
                        // ==================== 变量名混淆配置 ====================
                        renameGlobals: false,                   // 禁用全局变量混淆，防止核心对象被重命名导致崩溃
                        identifierNamesGenerator: "mangled-shuffled", // 极短随机局部变量名
                        identifierNamesCache: null,
                        identifiersPrefix: "",                  // 原生命名规则
                        
                        // 全局保留字列表（保护 Worker 环境必需的关键标识符，兼容 sockets 代理与原生接口）
                        reservedNames: [
                            "^self$", "^postMessage$", "^onmessage$", "^close$",
                            "^addEventListener$", "^removeEventListener$",
                            "^fetch$", "^Request$", "^Response$", "^Headers$",
                            "^crypto$", "^subtle$",
                            "^performance$", "^Date$", "^setTimeout$", "^clearTimeout$",
                            "^setInterval$", "^clearInterval$",
                            "^console$", "^debugger$",
                            "^env$", "^ctx$", "^context$", "^request$",
                            "^import\\.meta$", "^import\\.meta\\.url$",
                            "^connect$", "^export$", "^default$", "^WebSocket$", "^HTMLRewriter$"
                        ],
                        
                        // ==================== 属性名混淆（严格禁用，确保 API 正常） ====================
                        renameProperties: false,
                        renamePropertiesMode: "safe",
                        
                        // ==================== 字符串深度保护（优化版，平衡安全与兼容性） ====================
                        stringArray: true,                      // 开启全局字符串阵列
                        stringArrayEncoding: ["none"],          // 禁用动态解码，降低 Worker 内存和 CPU 运行开销
                        stringArrayThreshold: 0.8,              // 80% 字符串抽离
                        stringArrayRotate: false,               // 禁用自执行数组滚动，避免重复混淆时死循环
                        stringArrayShuffle: true,               // 打乱数组顺序，切断静态上下文分析
                        stringArrayWrappersCount: 1,            // 1 层包装函数
                        stringArrayWrappersType: "variable",    // 变量包装型，极致轻量
                        stringArrayWrappersChainedCalls: false, // 禁用链式调用
                        stringArrayWrappersParametersMaxCount: 2,
                        stringArrayCallsTransform: false,       // 禁用调用转换
                        
                        // ==================== 兼容性关键设置 ====================
                        splitStrings: false,                    // 禁用字符串拆分，保障动态导入
                        splitStringsChunkLength: 5,
                        unicodeEscapeSequence: false,           // 禁用 Unicode 转义
                        numbersToExpressions: false,            // 禁用数字计算表达式
                        transformObjectKeys: false,             // 保持对象键结构稳定
                        selfDefending: false,                   // 禁用自我防御
                        debugProtection: false,                 // 禁用反调试
                        debugProtectionInterval: 0,
                        disableConsoleOutput: false,            // 保留控制台输出
                        domainLock: [],                         // 不锁定域名
                        ignoreImports: true                     // 保护 ES 模块导入导出语法 (import/export)
                    };

                    if (typeof JavaScriptObfuscator === "undefined") {
                        throw new Error("JavaScriptObfuscator 库未加载，请刷新页面后重试");
                    }

                    const obfuscationResult = JavaScriptObfuscator.obfuscate(rawSource, config);
                    const obfuscatedCode = obfuscationResult.getObfuscatedCode();

                    outputCode.value = obfuscatedCode;
                    outputBadge.innerText = "混淆完成";
                    outputBadge.style.color = "#4caf50";
                    updateOutputStats(obfuscatedCode);

                    processBtn.disabled = false;
                    processBtn.innerText = "⚡ 开始混淆";
                    statusTip.innerText = "🎉 混淆完成！可直接复制或下载";
                    statusTip.style.color = "var(--success-color)";
                } catch (err) {
                    console.error(err);
                    alert("混淆失败: " + err.message);
                    processBtn.disabled = false;
                    processBtn.innerText = "⚡ 开始混淆";
                    statusTip.innerText = "❌ 混淆出错: " + err.message;
                    statusTip.style.color = "var(--danger-color)";
                    outputBadge.innerText = "出错";
                    outputBadge.style.color = "var(--danger-color)";
                }
            }, 50);
        });
    </script>
</body>
</html>
