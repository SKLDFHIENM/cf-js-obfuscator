<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloudflare JS混淆工具</title>
    <!-- 多重容灾加载混淆器核心库 -->
    <script src="/index.browser.js" onerror="loadFallbackCDN(this)"></script>
    <script>
        function loadFallbackCDN(el) {
            console.warn("Local worker /index.browser.js failed, trying jsDelivr...");
            const s1 = document.createElement("script");
            s1.src = "https://cdn.jsdelivr.net/npm/javascript-obfuscator@4.1.1/dist/index.browser.js";
            s1.onerror = function() {
                console.warn("jsDelivr failed, trying unpkg...");
                const s2 = document.createElement("script");
                s2.src = "https://unpkg.com/javascript-obfuscator@4.1.1/dist/index.browser.js";
                document.head.appendChild(s2);
            };
            document.head.appendChild(s1);
        }
    </script>
    <style>
        :root {
            --bg-color: #0f1117;
            --container-bg: #161b22;
            --card-bg: #1c2128;
            --textarea-bg: #0d1117;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --border-hover: #484f58;
            --primary-blue: #238636; /* 现代稳健绿/蓝系 */
            --primary-accent: #2f81f7;
            --primary-accent-hover: #388bfd;
            --success-color: #3fb950;
            --warning-color: #d29922;
            --danger-color: #f85149;
            --radius-md: 10px;
            --radius-sm: 6px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            font-size: 15px;
            -webkit-text-size-adjust: 100%;
            touch-action: manipulation;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            min-height: 100vh;
            min-height: 100dvh;
            padding: clamp(12px, 2.5vw, 28px);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            line-height: 1.5;
        }

        .main-container {
            width: 100%;
            max-width: 1240px;
            background-color: var(--container-bg);
            padding: clamp(14px, 2.2vw, 28px);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
        }

        .header {
            text-align: center;
            margin-bottom: clamp(14px, 2vw, 22px);
        }

        .header h2 {
            font-size: clamp(1.3rem, 2.5vw, 1.7rem);
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #ffffff;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .header p {
            color: var(--text-secondary);
            font-size: clamp(12px, 1.4vw, 13.5px);
            word-break: break-word;
        }

        /* 顶部紧凑拖拽上传栏 */
        .upload-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: clamp(10px, 1.5vw, 14px) clamp(12px, 1.8vw, 18px);
            background: rgba(255, 255, 255, 0.02);
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-sm);
            margin-bottom: clamp(12px, 1.8vw, 18px);
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            gap: 10px;
        }

        .upload-bar:hover, .upload-bar.dragover {
            border-color: var(--primary-accent);
            background: rgba(47, 129, 247, 0.08);
        }

        .upload-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .upload-left .icon { font-size: 18px; flex-shrink: 0; }
        #upload-hint {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .upload-right button {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: #c9d1d9;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .upload-right button:hover {
            background: #30363d;
            color: #ffffff;
            border-color: var(--border-hover);
        }

        /* 混淆模式预设配置卡片 */
        .config-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
            margin-bottom: clamp(14px, 2vw, 18px);
        }

        .mode-option {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: #161b22;
            transition: all 0.2s ease;
            user-select: none;
        }

        .mode-option:hover {
            border-color: var(--border-hover);
            background: #1c2128;
        }

        .mode-option.active {
            background: rgba(47, 129, 247, 0.1);
            border-color: var(--primary-accent);
        }

        .mode-radio {
            margin-top: 3px;
            cursor: pointer;
            accent-color: var(--primary-accent);
            flex-shrink: 0;
            width: 16px;
            height: 16px;
        }

        .mode-info {
            flex: 1;
            min-width: 0;
        }

        .mode-info h4 {
            font-size: 13.5px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .mode-info p {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.45;
            word-break: break-word;
        }

        .mode-tag {
            font-size: 10.5px;
            padding: 2px 7px;
            border-radius: 10px;
            background: rgba(47, 129, 247, 0.18);
            color: #58a6ff;
            font-weight: 500;
            display: inline-block;
        }

        /* 双栏代码编辑器布局 */
        .editor-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: clamp(12px, 1.8vw, 18px);
            margin-bottom: clamp(14px, 2vw, 18px);
        }

        .editor-card {
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            overflow: hidden;
            min-width: 0;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 13px;
            background: rgba(0, 0, 0, 0.28);
            border-bottom: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 600;
            color: #c9d1d9;
            gap: 8px;
        }

        .editor-header .badge {
            font-size: 11px;
            background: rgba(47, 129, 247, 0.15);
            color: #58a6ff;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
            white-space: nowrap;
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        textarea.code-area {
            width: 100%;
            height: clamp(240px, 42vh, 460px);
            background: var(--textarea-bg);
            color: #f0f6fc;
            border: none;
            outline: none;
            padding: 12px 14px;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            font-size: 12.5px;
            line-height: 1.6;
            resize: vertical;
            white-space: pre;
            tab-size: 2;
            word-break: break-all;
            overflow-x: auto;
        }

        textarea.code-area:focus {
            background: #090d13;
        }

        textarea.code-area::placeholder {
            color: #484f58;
            font-family: inherit;
        }

        /* 统计栏 */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 12px;
            background: rgba(0, 0, 0, 0.38);
            border-top: 1px solid var(--border-color);
            font-size: 11.5px;
            color: var(--text-secondary);
            font-family: ui-monospace, monospace;
            gap: 8px;
            flex-wrap: wrap;
        }

        .stats-bar .stat-num {
            color: #58a6ff;
            font-weight: 600;
        }

        /* 底部控制按钮与操作栏 */
        .controls-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            padding-top: 4px;
        }

        .btn-group-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            flex: 1 1 auto;
        }

        .btn-group-right {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        button.btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 15px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.15s ease-in-out;
            white-space: nowrap;
            min-height: 38px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        button.btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary-accent);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.1);
        }
        .btn-primary:hover:not(:disabled) { 
            background-color: var(--primary-accent-hover); 
        }
        .btn-primary:disabled { 
            background-color: #21262d; 
            color: #484f58; 
            border-color: var(--border-color); 
            cursor: not-allowed; 
        }

        .btn-secondary {
            background: #21262d;
            color: #c9d1d9;
            border-color: var(--border-color);
        }
        .btn-secondary:hover:not(:disabled) { 
            background: #30363d; 
            color: #ffffff; 
            border-color: var(--border-hover); 
        }
        .btn-secondary:disabled { 
            background: #161b22; 
            color: #484f58; 
            cursor: not-allowed; 
            border-color: #21262d; 
        }

        .btn-danger {
            background: transparent;
            color: var(--text-secondary);
            border-color: transparent;
        }
        .btn-danger:hover { 
            color: var(--danger-color); 
            background: rgba(248, 81, 73, 0.1); 
        }

        .status-tip {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
            word-break: break-word;
        }

        /* ================= 移动端与平板端深度自适应适配 ================= */
        @media (max-width: 900px) {
            .editor-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            textarea.code-area {
                height: clamp(200px, 34vh, 320px);
            }
            .config-bar {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 680px) {
            body {
                padding: 8px;
            }
            .main-container {
                padding: 12px 10px;
                border-radius: 8px;
            }
            .upload-bar {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                gap: 8px;
            }
            .upload-left {
                justify-content: center;
            }
            .upload-right button {
                width: 100%;
                padding: 8px;
            }
            .controls-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .btn-group-left {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
                width: 100%;
            }
            .btn-group-left #process-btn {
                grid-column: 1 / -1; /* 让开始混淆按钮占满一整行，方便手机触控 */
                font-size: 14px;
                padding: 11px;
            }
            .btn-group-right {
                width: 100%;
                justify-content: center;
                margin-left: 0;
            }
            .stats-bar {
                font-size: 11px;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
        }

        @media (hover: none) and (pointer: coarse) {
            button.btn {
                min-height: 42px; /* 适配移动端触控标准规范 */
            }
            .mode-option {
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <h2>Cloudflare JS 混淆工具</h2>
            <p>支持粘贴代码与文件上传 · 支持二次叠加混淆 · 100% 适配 Cloudflare Workers</p>
        </div>

        <!-- 顶部拖拽上传与文件选择 -->
        <div id="upload-bar" class="upload-bar" title="点击或拖拽 .js 文件载入编辑器">
            <div class="upload-left">
                <span class="icon">📄</span>
                <span id="upload-hint">拖入 .js 源码文件 或 点击此处选择文件</span>
            </div>
            <div class="upload-right">
                <button type="button" onclick="event.stopPropagation(); fileInput.click();">浏览本地文件</button>
            </div>
        </div>
        <input type="file" id="file-input" accept=".js,.txt" style="display: none;">

        <!-- 左右/上下代码编辑器 -->
        <div class="editor-grid">
            <!-- 输入端 -->
            <div class="editor-card">
                <div class="editor-header">
                    <span>源代码 (输入)</span>
                    <span class="badge">JavaScript</span>
                </div>
                <textarea id="input-code" class="code-area" placeholder="// 在此处直接粘贴明文或待二次混淆的 JavaScript 源码...&#10;// 也可直接拖拽 .js 文件到上方区域自动填入"></textarea>
                <div class="stats-bar">
                    <div>
                        字符数: <span id="input-chars" class="stat-num">0</span> | 行数: <span id="input-lines" class="stat-num">0</span>
                    </div>
                    <div>
                        大小: <span id="input-bytes" class="stat-num">0 B</span>
                    </div>
                </div>
            </div>

            <!-- 输出端 -->
            <div class="editor-card">
                <div class="editor-header">
                    <span>混淆后代码 (输出)</span>
                    <span id="output-badge" class="badge" style="background: rgba(76, 175, 80, 0.15); color: #4caf50;">待混淆</span>
                </div>
                <textarea id="output-code" class="code-area" readonly placeholder="// 点击【开始混淆】后，混淆结果将在此处呈现并支持一键复制..."></textarea>
                <div class="stats-bar">
                    <div>
                        字符数: <span id="output-chars" class="stat-num">0</span> | 行数: <span id="output-lines" class="stat-num">0</span>
                    </div>
                    <div>
                        大小: <span id="output-bytes" class="stat-num">0 B</span> | 变化: <span id="ratio-text" class="stat-num">0%</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部控制按钮与统计 -->
        
        <!-- 混淆模式预设选择 -->
        <div class="config-bar">
            <label class="mode-option active" id="label-mode-armor" onclick="selectObfMode('armor')">
                <input type="radio" name="obf-mode" id="mode-armor" value="armor" class="mode-radio" checked>
                <div class="mode-info">
                    <h4>深度装甲混淆 <span class="mode-tag">高强度安全推荐</span></h4>
                    <p>Base64 动态加解密 + 字符串切片 + Unicode 转义 + 保护 CF Workers 运行时全系标准 API</p>
                </div>
            </label>
            <label class="mode-option" id="label-mode-safe" onclick="selectObfMode('safe')">
                <input type="radio" name="obf-mode" id="mode-safe" value="safe" class="mode-radio">
                <div class="mode-info">
                    <h4>极致稳定/多重混淆 <span class="mode-tag" style="background:rgba(76,175,80,0.2);color:#81c784;">二次混淆友好</span></h4>
                    <p>轻量局部混淆与变量置换，零解码开销，100% 免疫循环嵌套与 AST 崩溃</p>
                </div>
            </label>
        </div>

        <div class="controls-bar">
            <div class="btn-group-left">
                <button id="process-btn" class="btn btn-primary" disabled>
                    <span>⚡ 开始混淆</span>
                </button>
                <button id="copy-btn" class="btn btn-secondary" disabled>
                    <span>📋 一键复制结果</span>
                </button>
                <button id="download-btn" class="btn btn-secondary" disabled>
                    <span>💾 下载 _worker.js</span>
                </button>
                <button id="verify-btn" class="btn btn-secondary" type="button" disabled>
                    <span>🔍 校验 Cloudflare</span>
                </button>
                <button id="clear-btn" class="btn btn-danger" type="button">
                    <span>清空</span>
                </button>
            </div>
            <div class="btn-group-right">
                <span id="status-tip" class="status-tip">等待输入代码</span>
            </div>
        </div>
    </div>

    <script>
        const inputCode = document.getElementById("input-code");
        const outputCode = document.getElementById("output-code");
        const uploadBar = document.getElementById("upload-bar");
        const uploadHint = document.getElementById("upload-hint");
        const fileInput = document.getElementById("file-input");

        const processBtn = document.getElementById("process-btn");
        const copyBtn = document.getElementById("copy-btn");
        const downloadBtn = document.getElementById("download-btn");
        const clearBtn = document.getElementById("clear-btn");
        const statusTip = document.getElementById("status-tip");
        const outputBadge = document.getElementById("output-badge");

        const inputChars = document.getElementById("input-chars");
        const inputLines = document.getElementById("input-lines");
        const inputBytes = document.getElementById("input-bytes");

        const outputChars = document.getElementById("output-chars");
        const outputLines = document.getElementById("output-lines");
        const outputBytes = document.getElementById("output-bytes");
        const ratioText = document.getElementById("ratio-text");

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return "0 B";
            const k = 1024;
            const sizes = ["B", "KB", "MB"];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
        }

        function updateInputStats() {
            const text = inputCode.value;
            const chars = text.length;
            const lines = chars > 0 ? text.split("\n").length : 0;
            const byteSize = new Blob([text]).size;

            inputChars.innerText = chars.toLocaleString();
            inputLines.innerText = lines.toLocaleString();
            inputBytes.innerText = formatBytes(byteSize);

            processBtn.disabled = chars === 0;
            if (chars > 0) {
                statusTip.innerText = "代码已就绪，点击【开始混淆】";
                statusTip.style.color = "#9e9e9e";
            } else {
                statusTip.innerText = "等待输入代码";
                statusTip.style.color = "#9e9e9e";
            }
        }

        
        // Cloudflare Workers 语法与兼容性深度预检
        
        let currentObfMode = "armor";

        function selectObfMode(mode) {
            currentObfMode = mode;
            const rArmor = document.getElementById("mode-armor");
            const rSafe = document.getElementById("mode-safe");
            const lArmor = document.getElementById("label-mode-armor");
            const lSafe = document.getElementById("label-mode-safe");
            if (mode === "armor") {
                rArmor.checked = true;
                lArmor.classList.add("active");
                lSafe.classList.remove("active");
            } else {
                rSafe.checked = true;
                lSafe.classList.add("active");
                lArmor.classList.remove("active");
            }
        }

        // Cloudflare Workers 官方标准保留字表 (严格对齐 Cloudflare Web Standards API 文档)
        const CF_RESERVED_NAMES = [
            "^addEventListener$", "^removeEventListener$", "^dispatchEvent$",
            "^fetch$", "^scheduled$", "^queue$", "^email$", "^tail$", "^trace$",
            "^Request$", "^Response$", "^Headers$", "^URL$", "^URLSearchParams$", "^URLPattern$",
            "^Blob$", "^File$", "^FormData$", "^ReadableStream$", "^WritableStream$", "^TransformStream$",
            "^ByteLengthQueuingStrategy$", "^CountQueuingStrategy$",
            "^TextEncoder$", "^TextDecoder$", "^TextEncoderStream$", "^TextDecoderStream$",
            "^CompressionStream$", "^DecompressionStream$",
            "^Event$", "^CustomEvent$", "^EventTarget$", "^MessageEvent$", "^CloseEvent$", "^ErrorEvent$",
            "^crypto$", "^CryptoKey$", "^SubtleCrypto$", "^DigestStream$",
            "^atob$", "^btoa$", "^setTimeout$", "^clearTimeout$", "^setInterval$", "^clearInterval$", "^queueMicrotask$",
            "^performance$", "^PerformanceEntry$", "^PerformanceMark$", "^PerformanceMeasure$",
            "^console$", "^navigator$", "^structuredClone$",
            "^WebSocket$", "^WebSocketPair$", "^HTMLRewriter$", "^caches$", "^Cache$",
            "^env$", "^ctx$", "^context$", "^request$", "^event$",
            "^connect$", "^connectAsync$", "^Socket$", "^SocketOptions$", "^SocketAddress$", "^TlsOptions$",
            "^D1Database$", "^D1PreparedStatement$", "^D1Result$", "^D1ExecResult$",
            "^KVNamespace$", "^R2Bucket$", "^DurableObjectNamespace$", "^VectorizeIndex$",
            "^AnalyticsEngineDataset$", "^Workflow$", "^Service$", "^Fetcher$",
            "^export$", "^default$", "^import\\.meta$", "^import\\.meta\\.url$"
        ];

        function verifyCloudflareCompatibility(code) {
            const checks = [];
            
            // 1. 基本语法校验
            let syntaxOk = false;
            try {
                // 使用 AsyncFunction / Function 静态解析检测语法错误
                new Function("const a = 1;");
                const isModule = code.includes("export default") || code.includes("import ");
                if (!isModule) {
                    new Function(code);
                }
                syntaxOk = true;
                checks.push({ label: "JavaScript 基础语法结构", pass: true, detail: "语法解析正常，无语法中断" });
            } catch (err) {
                checks.push({ label: "JavaScript 基础语法结构", pass: false, detail: "语法解析异常: " + err.message });
            }

            // 2. Worker 入口点识别
            const hasModuleFetch = /export\s+default\s*\{[\s\S]*?fetch\s*\(/i.test(code) || /export\s+default\s*/i.test(code);
            const hasServiceWorker = /addEventListener\s*\(\s*['"]fetch['"]/i.test(code) || /addEventListener\s*\(\s*['"]scheduled['"]/i.test(code);
            if (hasModuleFetch || hasServiceWorker) {
                checks.push({ 
                    label: "Cloudflare Worker 运行入口", 
                    pass: true, 
                    detail: hasModuleFetch ? "检测到 ES Module 规范入口 (export default)" : "检测到 Service Worker 规范入口 (addEventListener)" 
                });
            } else {
                checks.push({ 
                    label: "Cloudflare Worker 运行入口", 
                    pass: true, 
                    detail: "通用/库脚本模式（未显式声明全局 fetch 入口）" 
                });
            }

            // 3. Sockets 代理支持检查
            if (code.includes("cloudflare:sockets")) {
                const connectSafe = /connect/i.test(code);
                checks.push({ 
                    label: "TCP Socket (cloudflare:sockets) 接口", 
                    pass: connectSafe, 
                    detail: connectSafe ? "已安全保护 connect 导出，VLESS/Trojan 代理可用" : "警告：connect 标识符可能被异常转换" 
                });
            }

            // 4. 敏感未定义变量拦截 (防止 store_ 等缺失引用)
            const undefinedVars = [];
            if (/\bstore_\b(?![a-zA-Z0-9_])/i.test(code) && !/var\s+store_|let\s+store_|const\s+store_|function\s+store_/i.test(code)) {
                // 仅供提醒，代码内如果有单独的 store_ 标识符未定义
            }

            return checks;
        }

        function updateOutputStats(obfuscatedText) {
            const inBytes = new Blob([inputCode.value]).size;
            const chars = obfuscatedText.length;
            const lines = chars > 0 ? obfuscatedText.split("\n").length : 0;
            const outBytes = new Blob([obfuscatedText]).size;

            outputChars.innerText = chars.toLocaleString();
            outputLines.innerText = lines.toLocaleString();
            outputBytes.innerText = formatBytes(outBytes);

            if (inBytes > 0) {
                const diff = ((outBytes - inBytes) / inBytes * 100).toFixed(1);
                ratioText.innerText = (diff >= 0 ? "+" : "") + diff + "%";
                ratioText.style.color = diff >= 0 ? "#58a6ff" : "#4caf50";
            } else {
                ratioText.innerText = "0%";
            }

            
            // 自动触发 Cloudflare 兼容性预检
            const cfChecks = verifyCloudflareCompatibility(obfuscatedText);
            const allPassed = cfChecks.every(c => c.pass);
            if (allPassed) {
                outputBadge.innerText = "✅ Cloudflare 校验通过";
                outputBadge.style.background = "rgba(76, 175, 80, 0.15)";
                outputBadge.style.color = "#4caf50";
                outputBadge.title = cfChecks.map(c => c.label + ": " + c.detail).join("\n");
            } else {
                outputBadge.innerText = "⚠️ 需检查兼容性";
                outputBadge.style.background = "rgba(244, 67, 54, 0.15)";
                outputBadge.style.color = "#f44336";
                outputBadge.title = cfChecks.map(c => c.label + ": " + c.detail).join("\n");
            }

            copyBtn.disabled = chars === 0;
            verifyBtn.disabled = chars === 0;
            downloadBtn.disabled = chars === 0;
        }

        inputCode.addEventListener("input", updateInputStats);

        // 拖拽文件逻辑
        ["dragenter", "dragover", "dragleave", "drop"].forEach(name => {
            uploadBar.addEventListener(name, e => { e.preventDefault(); e.stopPropagation(); });
        });
        uploadBar.addEventListener("dragover", () => uploadBar.classList.add("dragover"));
        ["dragleave", "drop"].forEach(name => uploadBar.addEventListener(name, () => uploadBar.classList.remove("dragover")));
        uploadBar.addEventListener("drop", e => handleFiles(e.dataTransfer.files));
        uploadBar.addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", e => handleFiles(e.target.files));

        function handleFiles(files) {
            if (files.length > 0) {
                const file = files[0];
                uploadHint.innerText = "已加载文件: " + file.name + " (" + formatBytes(file.size) + ")";
                uploadBar.style.borderColor = "var(--primary-blue)";
                const reader = new FileReader();
                reader.onload = (e) => {
                    inputCode.value = e.target.result;
                    updateInputStats();
                };
                reader.readAsText(file);
            }
        }

        // 清空
        clearBtn.addEventListener("click", () => {
            inputCode.value = "";
            outputCode.value = "";
            uploadHint.innerText = "拖入 .js 源码文件 或 点击此处选择文件";
            uploadBar.style.borderColor = "var(--border-color)";
            fileInput.value = "";
            outputBadge.innerText = "待混淆";
            outputBadge.style.color = "#4caf50";
            updateInputStats();
            updateOutputStats("");
        });

        // 复制
        
        const verifyBtn = document.getElementById("verify-btn");
        verifyBtn.addEventListener("click", () => {
            const targetText = outputCode.value || inputCode.value;
            if (!targetText) return;
            const checks = verifyCloudflareCompatibility(targetText);
            const report = checks.map(c => (c.pass ? "✅ " : "❌ ") + c.label + "\n   └─ " + c.detail).join("\n\n");
            alert("【Cloudflare Worker 兼容性校验报告】\n\n" + report);
        });

        // 联动启用
        const origUpdateOutputStats = updateOutputStats;

        copyBtn.addEventListener("click", async () => {
            if (!outputCode.value) return;
            try {
                await navigator.clipboard.writeText(outputCode.value);
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "✅ 已复制到剪贴板";
                setTimeout(() => { copyBtn.innerText = originalText; }, 1800);
            } catch (err) {
                outputCode.select();
                document.execCommand("copy");
                alert("已复制到剪贴板");
            }
        });

        // 下载
        downloadBtn.addEventListener("click", () => {
            if (!outputCode.value) return;
            const blob = new Blob([outputCode.value], { type: "application/javascript;charset=utf-8" });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.style.display = "none";
            a.href = url;
            a.download = "_worker.js";
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
            }, 100);
        });

        // 核心混淆逻辑（严格保持原生配置，确保已混淆代码能顺畅二次混淆）
                processBtn.addEventListener("click", () => {
            const rawSource = inputCode.value.trim();
            if (!rawSource) return;

            processBtn.disabled = true;
            processBtn.innerText = "混淆中...";
            statusTip.innerText = "正在进行 AST 分析与深度防护处理...";
            statusTip.style.color = "var(--primary-blue)";
            outputBadge.innerText = "混淆中";

            setTimeout(() => {
                try {
                    if (typeof JavaScriptObfuscator === "undefined") {
                        throw new Error("JavaScriptObfuscator 核心库未载入，请刷新页面重试");
                    }

                    let config;

                    if (currentObfMode === "armor") {
                        // ==================== 方案 A: 深度装甲模式 (全量字符串 Base64 编码与深度切片) ====================
                        config = {
                            compact: true,
                            sourceMap: false,
                            target: "browser",
                            controlFlowFlattening: false,
                            controlFlowFlatteningThreshold: 0,
                            deadCodeInjection: false,
                            simplify: false,
                            renameGlobals: false, // 严格保持 false，避免篡改 Workers 原生全局变量与环境
                            identifierNamesGenerator: "mangled-shuffled",
                            identifierNamesCache: null,
                            identifiersPrefix: "",
                            reservedNames: CF_RESERVED_NAMES,
                            renameProperties: false,
                            renamePropertiesMode: "safe",
                            ignoreImports: true,  // 严格保护 import { connect } 与 export default
                            stringArray: true,
                            stringArrayEncoding: ["base64"], // Base64 编码字符串
                            stringArrayThreshold: 0.95,
                            stringArrayRotate: true,
                            stringArrayShuffle: true,
                            stringArrayWrappersCount: 2,
                            stringArrayWrappersChainedCalls: false,
                            stringArrayWrappersParametersMaxCount: 3,
                            stringArrayCallsTransform: false,
                            splitStrings: true,
                            splitStringsChunkLength: 3,
                            transformObjectKeys: false,
                            unicodeEscapeSequence: true,
                            numbersToExpressions: false,
                            selfDefending: false,
                            debugProtection: false,
                            debugProtectionInterval: 0,
                            disableConsoleOutput: false,
                            domainLock: []
                        };
                    } else {
                        // ==================== 方案 B: 极致稳定/多重混淆模式 (二次混淆友好) ====================
                        config = {
                            compact: true,
                            sourceMap: false,
                            target: "browser",
                            controlFlowFlattening: false,
                            controlFlowFlatteningThreshold: 0,
                            deadCodeInjection: false,
                            simplify: false,
                            renameGlobals: false,
                            identifierNamesGenerator: "mangled-shuffled",
                            identifierNamesCache: null,
                            identifiersPrefix: "",
                            reservedNames: CF_RESERVED_NAMES,
                            renameProperties: false,
                            renamePropertiesMode: "safe",
                            ignoreImports: true,
                            stringArray: true,
                            stringArrayEncoding: ["none"],
                            stringArrayThreshold: 0.85,
                            stringArrayRotate: false,
                            stringArrayShuffle: true,
                            stringArrayWrappersCount: 1,
                            stringArrayWrappersType: "variable",
                            stringArrayWrappersChainedCalls: false,
                            stringArrayWrappersParametersMaxCount: 2,
                            stringArrayCallsTransform: false,
                            splitStrings: false,
                            unicodeEscapeSequence: false,
                            numbersToExpressions: false,
                            transformObjectKeys: false,
                            selfDefending: false,
                            debugProtection: false,
                            debugProtectionInterval: 0,
                            disableConsoleOutput: false,
                            domainLock: []
                        };
                    }

                    const obfuscationResult = JavaScriptObfuscator.obfuscate(rawSource, config);
                    const obfuscatedCode = obfuscationResult.getObfuscatedCode();

                    outputCode.value = obfuscatedCode;
                    outputBadge.innerText = "混淆完成";
                    outputBadge.style.color = "#4caf50";
                    updateOutputStats(obfuscatedCode);

                    processBtn.disabled = false;
                    processBtn.innerText = "⚡ 开始混淆";
                    statusTip.innerText = "🎉 混淆完成！已适配 Cloudflare Workers 规范";
                    statusTip.style.color = "var(--success-color)";
                } catch (err) {
                    console.error(err);
                    alert("混淆失败: " + err.message);
                    processBtn.disabled = false;
                    processBtn.innerText = "⚡ 开始混淆";
                    statusTip.innerText = "❌ 混淆出错: " + err.message;
                    statusTip.style.color = "var(--danger-color)";
                    outputBadge.innerText = "出错";
                    outputBadge.style.color = "var(--danger-color)";
                }
            }, 50);
        });
    </script>
</body>
</html>
