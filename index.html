<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cloudflare JS混淆工具</title>
    <!-- 多重容灾加载混淆器核心库 -->
    <script src="/index.browser.js" onerror="loadFallbackCDN(this)"></script>
    <script>
        function loadFallbackCDN(el) {
            console.warn("Local worker /index.browser.js failed, trying jsDelivr...");
            const s1 = document.createElement("script");
            s1.src = "https://cdn.jsdelivr.net/npm/javascript-obfuscator@4.1.1/dist/index.browser.js";
            s1.onerror = function() {
                console.warn("jsDelivr failed, trying unpkg...");
                const s2 = document.createElement("script");
                s2.src = "https://unpkg.com/javascript-obfuscator@4.1.1/dist/index.browser.js";
                document.head.appendChild(s2);
            };
            document.head.appendChild(s1);
        }
    </script>
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-primary: #e0e0e0;
            --border-color: #333333;
            --primary-blue: #2196f3;
            --hover-blue: #1976d2;
            --success-color: #4caf50;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color); 
            color: var(--text-primary); 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--container-bg);
            padding: 28px 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        h2 { 
            text-align: center; 
            margin-bottom: 22px; 
            font-size: 1.45rem; 
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        #drop-zone { 
            border: 2px dashed var(--border-color); 
            padding: 42px 16px;
            text-align: center; 
            cursor: pointer; 
            background-color: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        #drop-zone:hover, #drop-zone.dragover { 
            border-color: var(--primary-blue); 
            background-color: rgba(33, 150, 243, 0.06); 
        }

        .dz-icon { font-size: 34px; margin-bottom: 12px; }
        .dz-text { color: #8c8c8c; font-size: 14px; line-height: 1.5; }

        #file-info { display: none; text-align: center; width: 100%; }
        #filename-text { color: var(--primary-blue); font-weight: 600; font-size: 15px; margin-top: 8px; word-break: break-all; }
        #filesize-text { color: #777; font-size: 12px; margin-top: 4px; }

        .feature-tags {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 18px 0 10px 0;
            flex-wrap: wrap;
        }
        .tag {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.05);
            color: #999;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid #2e2e2e;
        }

        .actions { margin-top: 15px; }

        button { 
            width: 100%;
            padding: 14px; 
            background-color: var(--primary-blue); 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, opacity 0.2s ease;
        }

        button:hover:not(:disabled) { background-color: var(--hover-blue); }
        button:disabled { background-color: #333333; color: #666666; cursor: not-allowed; opacity: 0.7; }
        
        .status-msg {
            margin-top: 12px;
            text-align: center;
            font-size: 12px;
            color: #777;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h2>Cloudflare JS 混淆工具</h2>
        
        <div id="drop-zone">
            <div id="dz-prompt">
                <div class="dz-icon">📄</div>
                <div class="dz-text">点击这里选择 或 直接拖入 .js 源码文件<br><span style="font-size:12px;color:#888;">(支持原码混淆 与 已混淆脚本二次叠加混淆)</span></div>
            </div>
            
            <div id="file-info">
                <div class="dz-icon">✅</div>
                <div id="filename-text"></div>
                <div id="filesize-text"></div>
            </div>
        </div>
        
        <input type="file" id="file-input" accept=".js,.txt" style="display: none;">

        <div class="feature-tags">
            <span class="tag">⚡ 零服务端存储</span>
            <span class="tag">🛡️ 支持二次混淆</span>
            <span class="tag">☁️ 100% 适配 CF Worker</span>
        </div>

        <div class="actions">
            <button id="process-btn" disabled>开始混淆并下载</button>
        </div>
        <div id="status-msg" class="status-msg"></div>
    </div>

    <script>
        
        // 核心库异步加载状态监测
        window.addEventListener("DOMContentLoaded", () => {
            const checkInterval = setInterval(() => {
                if (typeof JavaScriptObfuscator !== "undefined") {
                    clearInterval(checkInterval);
                    console.log("JavaScriptObfuscator 引擎加载就绪");
                }
            }, 200);
        });

        const dropZone = document.getElementById("drop-zone");
        const dzPrompt = document.getElementById("dz-prompt");
        const fileInfo = document.getElementById("file-info");
        const filenameText = document.getElementById("filename-text");
        const filesizeText = document.getElementById("filesize-text");
        const fileInput = document.getElementById("file-input");
        const processBtn = document.getElementById("process-btn");
        const statusMsg = document.getElementById("status-msg");
        let selectedFile = null;

        // 拖拽逻辑
        ["dragenter", "dragover", "dragleave", "drop"].forEach(name => {
            dropZone.addEventListener(name, e => { e.preventDefault(); e.stopPropagation(); });
        });

        dropZone.addEventListener("dragover", () => dropZone.classList.add("dragover"));
        ["dragleave", "drop"].forEach(name => dropZone.addEventListener(name, () => dropZone.classList.remove("dragover")));
        dropZone.addEventListener("drop", e => handleFiles(e.dataTransfer.files));
        dropZone.onclick = () => fileInput.click();
        fileInput.onchange = e => handleFiles(e.target.files);

        function formatBytes(bytes) {
            if (bytes === 0) return "0 B";
            const k = 1024;
            const sizes = ["B", "KB", "MB"];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
        }

        function handleFiles(files) {
            if (files.length > 0) {
                selectedFile = files[0];
                dzPrompt.style.display = "none";
                fileInfo.style.display = "block";
                filenameText.innerText = selectedFile.name;
                filesizeText.innerText = formatBytes(selectedFile.size);
                processBtn.disabled = false;
                dropZone.style.borderColor = "var(--primary-blue)";
                statusMsg.innerText = "文件已就绪，点击上方按钮开始混淆";
                statusMsg.style.color = "#888";
            }
        }
        
        processBtn.onclick = () => {
            if (!selectedFile) return;
            
            processBtn.disabled = true;
            processBtn.innerText = "混淆处理中...";
            statusMsg.innerText = "正在执行 AST 分析与安全混淆...";
        
            const reader = new FileReader();
        
            reader.onload = async (e) => {
                try {
                    // 每次混淆生成独一无二的随机标识符前缀，避免对已混淆代码进行二次混淆时的命名空间冲突
                    const uniquePrefix = "_0x" + Math.random().toString(36).substring(2, 6) + "_";

                    const config = {
                        // ==================== 基础输出配置 ====================
                        compact: true,                          // 压缩代码至一行，减少体积，提升 Worker 加载速度
                        sourceMap: false,                       // 关闭 source map，生产环境不需要
                        target: "browser",                      // 输出目标为浏览器环境，适配 Cloudflare Workers 的 V8 引擎
                        
                        // ==================== 控制流保护（完全禁用，避免 CPU 超时） ====================
                        controlFlowFlattening: false,           // 禁用控制流扁平化，Workers 中复杂的控制流转换会导致 CPU 时间超限
                        controlFlowFlatteningThreshold: 0,      // 扁平化概率设为 0
                        deadCodeInjection: false,               // 禁用死代码注入，保持代码轻量，减少 Worker 内存占用
                        simplify: false,                        // 【重要】二次混淆时必须禁用简化，避免破坏已混淆 AST 和函数调用
                        
                        // ==================== 变量名混淆配置 ====================
                        renameGlobals: false,                   // 禁用全局变量混淆，防止 Worker 核心对象被重命名导致崩溃
                        identifierNamesGenerator: "mangled-shuffled", // 生成极短且随机的局部变量名（如 a、b、c），优化体积
                        identifierNamesCache: null,             // 不使用变量名缓存
                        identifiersPrefix: uniquePrefix,        // 【重要】动态前缀隔离，彻底支持多次/二次叠加混淆不冲突
                        
                        // 全局保留字列表：全面覆盖 Cloudflare Workers 核心 API 与模块规范
                        reservedNames: [
                            "^self$", "^postMessage$", "^onmessage$", "^close$",
                            "^addEventListener$", "^removeEventListener$", "^dispatchEvent$",
                            "^fetch$", "^Request$", "^Response$", "^Headers$", "^FormData$",
                            "^crypto$", "^subtle$", "^SubtleCrypto$",
                            "^performance$", "^Date$", "^setTimeout$", "^clearTimeout$",
                            "^setInterval$", "^clearInterval$", "^queueMicrotask$", "^structuredClone$",
                            "^console$", "^debugger$",
                            "^env$", "^ctx$", "^context$", "^request$", "^response$",
                            "^import\\.meta$", "^import\\.meta\\.url$",
                            "^export$", "^default$", "^connect$",                   // CF TCP 代理 sockets (cloudflare:sockets)
                            "^WebSocket$", "^WebSocketPair$", "^HTMLRewriter$",     // Worker 原生特有 API
                            "^caches$", "^ReadableStream$", "^WritableStream$", "^TransformStream$",
                            "^ByteLengthQueuingStrategy$", "^CountQueuingStrategy$",
                            "^TextEncoder$", "^TextDecoder$", "^URL$", "^URLSearchParams$",
                            "^atob$", "^btoa$", "^importScripts$"
                        ],
                        
                        // ==================== 属性名混淆（严格禁用，确保 API 调用安全） ====================
                        renameProperties: false,                // 严格禁用属性名混淆，确保对象属性访问、JSON 解析、API 调用 100% 正常
                        renamePropertiesMode: "safe",
                        
                        // ==================== 字符串深度保护（优化版，平衡安全与兼容性） ====================
                        stringArray: true,                      // 开启全局字符串阵列，将所有字符串提取到统一数组
                        stringArrayEncoding: ["none"],          // 禁用动态解码，降低 Worker 内存和 CPU 运行开销
                        stringArrayThreshold: 0.8,              // 80% 字符串抽离
                        stringArrayRotate: false,               // 禁用自执行数组滚动，避免重复混淆时死循环
                        stringArrayShuffle: true,               // 随机打乱字符串数组顺序，让静态分析无法直接匹配字符串
                        stringArrayWrappersCount: 1,            // 使用 1 层包装函数
                        stringArrayWrappersType: "variable",    // 使用变量类型包装器，比 function 类型性能更好
                        stringArrayWrappersChainedCalls: false, // 禁用包装函数的链式调用
                        stringArrayWrappersParametersMaxCount: 2,
                        stringArrayCallsTransform: false,       // 禁用字符串调用转换，降低运行时复杂度
                        
                        // ==================== 兼容性关键设置 ====================
                        splitStrings: false,                    // 禁用字符串拆分，避免破坏 eval、import.meta 等动态代码
                        splitStringsChunkLength: 5,
                        unicodeEscapeSequence: false,           // 禁用 Unicode 转义，避免体积膨胀和正则表达式构造错误
                        numbersToExpressions: false,            // 禁用数字转换为数学表达式，提升 Worker 运行速度
                        transformObjectKeys: false,             // 不转换对象键名，确保对象结构可预测
                        selfDefending: false,                   // 禁用自我防御，Worker 环境中开启该选项极易导致运行时错误
                        debugProtection: false,                 // 禁用反调试保护，不影响正常执行
                        debugProtectionInterval: 0,
                        disableConsoleOutput: false,            // 保留 console 输出用于状态检测和调试
                        domainLock: [],                         // 不锁定域名，保持部署灵活性
                        ignoreImports: true                     // 保护 ES 模块导入导出语法 (import/export)
                    };
        
                    if (typeof JavaScriptObfuscator === "undefined") {
                        throw new Error("混淆核心库未能及时加载，请刷新页面后重试");
                    }
        
                    const obfuscationResult = JavaScriptObfuscator.obfuscate(e.target.result, config);
                    const obfuscatedCode = obfuscationResult.getObfuscatedCode();
        
                    // 下载处理
                    const blob = new Blob([obfuscatedCode], { type: "application/javascript;charset=utf-8" });
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.style.display = "none";
                    a.href = url;
                    a.download = "_worker.js";
                    
                    document.body.appendChild(a);
                    a.click();
                    
                    setTimeout(() => {
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                        processBtn.disabled = false;
                        processBtn.innerText = "开始混淆并下载";
                        statusMsg.innerText = "🎉 混淆完成并已自动开始下载 _worker.js";
                        statusMsg.style.color = "var(--success-color)";
                    }, 200);
        
                } catch (err) {
                    console.error(err);
                    alert("混淆失败: " + err.message);
                    processBtn.disabled = false;
                    processBtn.innerText = "开始混淆并下载";
                    statusMsg.innerText = "❌ 混淆出错: " + err.message;
                    statusMsg.style.color = "#ff5252";
                }
            };
            reader.readAsText(selectedFile);
        };        
    </script>
</body>
</html>
